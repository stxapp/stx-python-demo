{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
<p>This stands in for your app's own login: any name, no password. After signing in you connect your STX account.</p>
<form method="post" action="/login" class="stack">
  <label>Name <input name="name" required maxlength="40" autofocus></label>
  <button>Sign in</button>
</form>
{% endblock %}
