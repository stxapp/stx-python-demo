name: Feature request / example request
description: Suggest a new example, pattern, or improvement to an existing one.
title: "[enhancement] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to request new examples ("please show how to do X"), improvements to existing ones, or repo-level changes (CI, tooling).

        **For new SDK features (as opposed to examples of existing ones)**, file against the SDK repo instead of here.

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to accomplish?
      placeholder: |
        I'm building a bot that needs to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed example / change
      description: Sketch of what you'd like to see in this repo.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've explored, or examples elsewhere that come close.
    validations:
      required: false
