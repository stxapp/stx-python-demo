name: Bug report
description: Something in this demo isn't working.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in the sections below so the maintainers can reproduce quickly.

        **If your problem is with the `stx` SDK itself (not this demo), report it against the SDK package instead of here.**

  - type: input
    id: script
    attributes:
      label: Which example?
      description: The file you ran (e.g. `quickstart.py`, `list_markets.py`), or the step in the README.
      placeholder: "quickstart.py"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Which STX region and environment were you pointed at (STX_REGION / STX_ENV, or STX_HOST)?
      placeholder: "us / demo"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS + arch
      placeholder: "macOS 15.0 arm64 / Ubuntu 22.04 x64 / Windows 11 x64"
    validations:
      required: true

  - type: input
    id: stxpython
    attributes:
      label: stx-python version
      description: Output of `pip show stx-python | grep Version` (or `python -c "import stx; print(stx.__version__)"`).
      placeholder: "0.4.0a1"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands / env vars / config.
      placeholder: |
        1. export STX_EMAIL=... STX_PASSWORD=...
        2. python quickstart.py
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened, including error output / stack traces.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, workarounds you've tried.
    validations:
      required: false
