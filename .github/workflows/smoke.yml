name: Smoke tests

# Run every example against a live STX environment on every push/PR.
# Catches drift between the SDK and the API contract early: when this
# fails, either the SDK broke the example or the API contract changed.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Daily guard against API contract drift that isn't triggered by code
    # changes here. Cron: 13:00 UTC, about 09:00 Eastern.
    - cron: "0 13 * * *"
  # Manual trigger via `gh workflow run smoke.yml --repo stxapp/stx-python-demo --ref main`.
  # Useful for verifying immediately after publishing a new SDK alpha
  # rather than waiting up to 24h for the next cron.
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    env:
      # STX_PRIVATE_KEY may be a path or the PEM text; the secret holds
      # the PEM text so no file has to be written on the runner.
      STX_KEY_ID: ${{ secrets.STX_KEY_ID }}
      STX_PRIVATE_KEY: ${{ secrets.STX_PRIVATE_KEY }}
      STX_REGION: us
      STX_ENV: demo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stx-python
        # The pin lives in requirements.txt: single source of truth
        # shared with local devs. CI exercises the same install flow a
        # contributor would run on their laptop. Until stx-python 0.6.0
        # is on PyPI this step cannot resolve; see the README.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sanity import
        run: python -c "import stx; print('stx-python', stx.__version__)"

      # ---- Getting started ----------------------------------------
      - name: quickstart
        run: python quickstart.py

      - name: identity
        run: python identity.py

      # ---- Read-only data -----------------------------------------
      - name: list_markets
        run: python list_markets.py

      - name: account_overview
        run: python account_overview.py

      - name: history_pulls
        run: python history_pulls.py

      # ---- Trading ------------------------------------------------
      # 1-cent limit buys never fill; each script cancels what it placed
      # and sweeps the account in a finally block.
      - name: safe_order_round_trip
        timeout-minutes: 2
        run: python safe_order_round_trip.py

      - name: batch_orders
        timeout-minutes: 2
        run: python batch_orders.py

      # ---- WebSocket channels -------------------------------------
      # Each script joins one documented channel and listens briefly.
      - name: ws_orderbook
        timeout-minutes: 2
        run: python ws_orderbook.py --seconds 10

      - name: ws_ticker
        timeout-minutes: 2
        run: python ws_ticker.py --seconds 10

      - name: ws_trades
        timeout-minutes: 2
        run: python ws_trades.py --seconds 10

      - name: ws_markets
        timeout-minutes: 2
        run: python ws_markets.py --seconds 10

      - name: ws_market_stats
        timeout-minutes: 2
        run: python ws_market_stats.py --seconds 10

      - name: ws_market_updates
        timeout-minutes: 2
        run: python ws_market_updates.py --seconds 10

      - name: ws_orders
        timeout-minutes: 2
        run: python ws_orders.py --seconds 10

      - name: ws_fills
        timeout-minutes: 2
        run: python ws_fills.py --seconds 10

      - name: ws_positions
        timeout-minutes: 2
        run: python ws_positions.py --seconds 10

      - name: ws_settlements
        timeout-minutes: 2
        run: python ws_settlements.py --seconds 10

      - name: ws_balances
        timeout-minutes: 2
        run: python ws_balances.py --seconds 10

      - name: ws_account
        timeout-minutes: 2
        run: python ws_account.py --seconds 10

      - name: ws_user_info
        timeout-minutes: 2
        run: python ws_user_info.py --seconds 10

      # ---- Long-running -------------------------------------------
      - name: worker
        # Runs until Ctrl-C by default; bounded here.
        timeout-minutes: 2
        run: python worker.py --seconds 20

      # ---- Async patterns -----------------------------------------
      - name: async_parallel_pulls
        run: python async_parallel_pulls.py

      - name: async_with_ws
        timeout-minutes: 2
        run: python async_with_ws.py --seconds 15
