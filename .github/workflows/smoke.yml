name: Smoke tests

# Run every example against a live STX environment on every push/PR.
# Catches drift between the SDK and the API contract early: when this
# fails, either the SDK broke the example or the API contract changed.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Daily guard against API contract drift that isn't triggered by code
    # changes here. Cron: 13:00 UTC, about 09:00 Eastern.
    - cron: "0 13 * * *"
  # Manual trigger via `gh workflow run smoke.yml --repo stxapp/stx-python-demo --ref main`.
  # Useful for verifying immediately after publishing a new SDK alpha
  # rather than waiting up to 24h for the next cron.
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    env:
      # STX_PRIVATE_KEY may be a path or the PEM text; the secret holds
      # the PEM text so no file has to be written on the runner.
      STX_KEY_ID: ${{ secrets.STX_KEY_ID }}
      STX_PRIVATE_KEY: ${{ secrets.STX_PRIVATE_KEY }}
      STX_REGION: us
      STX_ENV: demo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stx-python
        # The pin lives in requirements.txt: single source of truth
        # shared with local devs. CI exercises the same install flow a
        # contributor would run on their laptop. Until stx-python 0.6.0
        # is on PyPI this step cannot resolve; see the README.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sanity import
        run: python -c "import stx; print('stx-python', stx.__version__)"

      # ---- Getting started ----------------------------------------
      - name: quickstart
        run: python quickstart.py

      - name: identity
        run: python identity.py

      # ---- Read-only data -----------------------------------------
      - name: list_markets
        run: python list_markets.py

      - name: account_overview
        run: python account_overview.py

      - name: history_pulls
        run: python history_pulls.py

      # ---- Trading ------------------------------------------------
      - name: safe_order_round_trip
        # 1 cent LIMIT BUY never fills; try/finally cancel-all sweeps any
        # leakage. Skips cleanly with SystemExit(0) if the env has no
        # tradable markets right now or the key is read_only.
        timeout-minutes: 2
        run: python safe_order_round_trip.py

      # ---- WebSocket streaming: markets channel ------------------
      # Each WS script has a ~30s listen window; cap the step at 2min
      # so a hung connection fails fast instead of burning the runner.
      - name: ws_markets_basic
        timeout-minutes: 2
        run: python ws_markets_basic.py

      - name: ws_markets_bids_offers
        timeout-minutes: 2
        run: python ws_markets_bids_offers.py

      - name: ws_markets_rule_filters
        timeout-minutes: 2
        run: python ws_markets_rule_filters.py

      - name: ws_markets_message_types
        timeout-minutes: 2
        run: python ws_markets_message_types.py

      - name: ws_markets_dynamic
        timeout-minutes: 2
        run: python ws_markets_dynamic.py

      - name: ws_markets_order_book
        timeout-minutes: 2
        run: python ws_markets_order_book.py

      - name: ws_markets_multi_order_book
        timeout-minutes: 2
        run: python ws_markets_multi_order_book.py

      # ---- WebSocket streaming: user streams ---------------------
      - name: ws_personal_stream
        timeout-minutes: 2
        run: python ws_personal_stream.py

      - name: ws_trades_stream
        timeout-minutes: 2
        run: python ws_trades_stream.py

      - name: ws_settlements_stream
        timeout-minutes: 2
        run: python ws_settlements_stream.py

      # ---- Long-running -------------------------------------------
      - name: worker
        # Runs until Ctrl-C by default; bounded here.
        timeout-minutes: 2
        run: python worker.py --seconds 20

      # ---- Async patterns -----------------------------------------
      - name: async_parallel_pulls
        run: python async_parallel_pulls.py

      - name: async_with_ws
        timeout-minutes: 2
        run: python async_with_ws.py
