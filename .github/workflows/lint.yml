name: Lint

# Offline checks that need no credentials, so they run on every PR
# including ones from forks. The live smoke run lives in smoke.yml.

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        # Rule set lives in ruff.toml (E, F, I).
        run: ruff check .

      - name: Byte-compile every script
        run: python -m py_compile *.py
